<!doctype html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Vagon · iPhone pregled</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eae6dd;color:#283c32;font:14px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:18px 24px;max-width:1080px;margin:auto}.identity{display:flex;align-items:center;gap:10px}.identity img{width:38px;height:38px;border-radius:50%}.identity strong{font-weight:600}.controls{display:flex;align-items:center;flex-wrap:wrap;gap:10px}select,button,a{font:inherit}select,button{border:1px solid #283c3230;border-radius:100px;padding:10px 16px;background:#faf7f0;color:#283c32}button{cursor:pointer}a{color:inherit;text-underline-offset:4px}.device-label{margin:0;text-align:center;color:#586458;font-size:12px}main{padding:4px 18px 24px}.phone-slot{position:relative;margin:14px auto 0}.phone{position:absolute;left:0;top:0;padding:9px;background:#20241f;border-radius:43px;box-shadow:0 18px 55px #283c3226;transform-origin:top left}.screen{overflow:hidden;border-radius:34px;background:#eae6dd}.screen iframe{display:block;border:0;background:#eae6dd}.phone::after{content:"";position:absolute;bottom:3px;left:calc(50% - 36px);width:72px;height:3px;border-radius:100px;background:#a6ab9d;pointer-events:none}:focus-visible{outline:3px solid #8b7448;outline-offset:3px}@media(max-width:540px){header{padding:14px 16px;justify-content:center}.controls{justify-content:center;gap:8px}select,button{padding:9px 12px}.identity{display:none}main{padding-inline:8px}}

.brand-logo,.footer-identity img{clip-path:circle(42% at 50% 50%);transform:scale(1.15)}
</style>
<link rel="icon" href="/assets/favicon-32.png?v=3" type="image/png" sizes="32x32"><link rel="icon" href="/assets/favicon-192.png?v=3" type="image/png" sizes="192x192"></head>
<body>
<header>
<div class="identity"><img src="/assets/vagon-logo.webp?v=3" width="38" height="38" alt=""><strong>Vagon · iPhone pregled</strong></div>
<div class="controls"><label for="device" class="device-label">iPhone</label><select id="device" aria-label="Veličina iPhone ekrana"><option value="390,844">13 / 14 · 390 × 844</option><option value="393,852">15 Pro · 393 × 852</option><option value="430,932">15 Pro Max · 430 × 932</option><option value="375,667">SE · 375 × 667</option></select><button id="reload" type="button">Osveži</button><a href="/" target="_blank" rel="noopener">Otvori sajt ↗</a></div>
</header>
<main>
<p class="device-label">Skroluj unutar telefona · isti sajt i animacije</p>
<div class="phone-slot" id="slot"><div class="phone" id="phone"><div class="screen" id="screen"><iframe id="site" src="/" title="Vagon — mobilni prikaz sajta" width="390" height="844"></iframe></div></div></div>
</main>
<script>
(()=>{const select=document.getElementById('device'),frame=document.getElementById('site'),phone=document.getElementById('phone'),screen=document.getElementById('screen'),slot=document.getElementById('slot');const fit=()=>{const [w,h]=select.value.split(',').map(Number);frame.width=w;frame.height=h;screen.style.width=w+'px';screen.style.height=h+'px';phone.style.width=(w+18)+'px';phone.style.height=(h+18)+'px';const availableWidth=document.documentElement.clientWidth-32;const availableHeight=Math.max(420,window.innerHeight-document.querySelector('header').offsetHeight-74);const scale=Math.min(1,availableWidth/(w+18),availableHeight/(h+18));phone.style.transform='scale('+scale+')';slot.style.width=(w+18)*scale+'px';slot.style.height=(h+18)*scale+'px'};select.addEventListener('change',fit);window.addEventListener('resize',fit);document.getElementById('reload').addEventListener('click',()=>{frame.src='/?preview='+Date.now()});fit()})();
</script>
</body>
</html>
